<div class="page-layout">

  <app-sidebar></app-sidebar>

  <main class="utilisateurs-page">

    <header class="utilisateurs-header">
      <div>
        <h1>Gestion des utilisateurs</h1>
        <p>Créez, modifiez les rôles et supprimez les comptes utilisateurs.</p>
      </div>
    </header>

    <section class="utilisateur-form">

      <h2>Nouvel utilisateur</h2>

      <div class="form-grid">

        <div class="form-group">
          <label>Nom d'utilisateur</label>
          <input
            type="text"
            [(ngModel)]="username"
            placeholder="Ex : user1"
          >
        </div>

        <div class="form-group">
          <label>Mot de passe</label>
          <input
            type="password"
            [(ngModel)]="password"
            placeholder="Mot de passe"
          >
        </div>

        <div class="form-group">
          <label>Rôle</label>
          <select [(ngModel)]="role">
            <option value="USER">USER</option>
            <option value="ADMIN">ADMIN</option>
          </select>
        </div>

      </div>

      <button
        type="button"
        class="btn-primary"
        (click)="creerUtilisateur()"
      >
        Créer l'utilisateur
      </button>

      <div
        class="message-success"
        *ngIf="message"
      >
        {{ message }}
      </div>

      <div
        class="message-error"
        *ngIf="erreur"
      >
        {{ erreur }}
      </div>

    </section>

    <section class="utilisateurs-list">

      <h2>Liste des utilisateurs</h2>

      <table>

        <thead>
        <tr>
          <th>ID</th>
          <th>Nom d'utilisateur</th>
          <th>Rôle</th>
          <th>Actions</th>
        </tr>
        </thead>

        <tbody>

        <tr *ngFor="let utilisateur of utilisateurs">

          <td>{{ utilisateur.id }}</td>

          <td>{{ utilisateur.username }}</td>

          <td>
            <select
              [ngModel]="utilisateur.role"
              (ngModelChange)="changerRole(utilisateur.id, $event)"
              [disabled]="utilisateur.username === currentUsername"
            >
              <option value="USER">USER</option>
              <option value="ADMIN">ADMIN</option>
            </select>
          </td>

          <td>
            <button
              type="button"
              class="btn-danger"
              (click)="supprimerUtilisateur(utilisateur.id)"
              [disabled]="utilisateur.username === currentUsername"
            >
              Supprimer
            </button>
          </td>

        </tr>

        <tr *ngIf="utilisateurs.length === 0">
          <td colspan="4" class="empty">
            Aucun utilisateur
          </td>
        </tr>

        </tbody>

      </table>

    </section>

  </main>

</div>
