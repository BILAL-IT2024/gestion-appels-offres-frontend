<div class="login-page">

  <div class="login-card">

    <div class="login-header">

      <div class="logo">
        📋
      </div>

      <h1>Gestion des Appels d'Offres</h1>

      <p>
        Connectez-vous pour accéder à votre espace de travail
      </p>

    </div>

    <form
      class="login-form"
      (ngSubmit)="login()">

      <div class="form-group">

        <label>
          Nom d'utilisateur
        </label>

        <input
          type="text"
          name="username"
          placeholder="Saisissez votre nom d'utilisateur"
          [(ngModel)]="username">

      </div>

      <div class="form-group">

        <label>
          Mot de passe
        </label>

        <input
          type="password"
          name="password"
          placeholder="Saisissez votre mot de passe"
          [(ngModel)]="password">

      </div>

      <button
        type="submit"
        class="login-button">

        Se connecter

      </button>

    </form>

    @if (errorMessage) {

    <div class="error-box">

      {{ errorMessage }}

    </div>

    }

    <div class="login-footer">

      Master BDCC • Projet de Fin d'Études

    </div>

  </div>

</div>
